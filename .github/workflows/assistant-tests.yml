name: DataGuard Assistant Tests

on:
  push:
    branches:
      - ui-shell-integration-keep-ml
    paths:
      - "assistant/**"
      - ".github/workflows/assistant-tests.yml"
  pull_request:
    paths:
      - "assistant/**"
      - ".github/workflows/assistant-tests.yml"

jobs:
  rule-based-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run assistant tests
        run: python -m unittest discover -s assistant/tests -v
